<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 3D地球 - AKKM团队</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#0a0a1a; overflow:hidden; }
        #container { width:100vw; height:100vh; position:relative; }
        #canvas { display:block; }
        .controls { position:absolute; top:20px; right:20px; background:rgba(20,20,40,0.8); border-radius:12px; padding:16px; color:#fff; z-index:100; }
        .controls h3 { margin-bottom:12px; font-size:1.1rem; }
        .control-group { margin-bottom:12px; }
        .control-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:#aaa; }
        .control-group input[type="range"] { width:150px; }
        .control-group span { font-size:0.8rem; color:#888; }
        .btn { background:#4f46e5; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:0.85rem; margin-right:8px; margin-bottom:8px; }
        .btn:hover { background:#4338ca; }
        .info { position:absolute; bottom:20px; left:20px; background:rgba(20,20,40,0.8); border-radius:12px; padding:16px; color:#fff; font-size:0.85rem; z-index:100; }
        .info span { color:#818cf8; }
        .title { position:absolute; top:20px; left:20px; color:#fff; font-size:1.5rem; font-weight:700; z-index:100; text-shadow:0 0 20px rgba(79,70,229,0.5); }
        .axis-indicator { position:absolute; bottom:20px; right:20px; width:60px; height:80px; background:rgba(20,20,40,0.8); border-radius:8px; padding:8px; z-index:100; }
        .axis-line { width:2px; height:30px; background:#fff; margin:0 auto; }
        .axis-label { text-align:center; font-size:0.7rem; color:#aaa; margin-top:4px; }
    </style>
</head>
<body>
    <div class="title">🌍 AKKM团队 - 3D地球</div>
    
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    
    <div class="controls">
        <h3>🎛️ 控制</h3>
        <div class="control-group">
            <label>自动旋转速度</label>
            <input type="range" id="rotationSpeed" min="0" max="5" step="0.1" value="1">
            <span id="speedValue">1.0</span>
        </div>
        <div class="control-group">
            <label>缩放</label>
            <input type="range" id="zoom" min="2" max="10" step="0.1" value="4">
            <span id="zoomValue">4.0</span>
        </div>
        <div class="control-group">
            <label>光照强度</label>
            <input type="range" id="lightIntensity" min="0.1" max="2" step="0.1" value="1">
            <span id="lightValue">1.0</span>
        </div>
        <div class="control-group">
            <button class="btn" onclick="resetView()">🔄 重置视角</button>
            <button class="btn" onclick="toggleRotation()">⏸️ 暂停/播放</button>
            <button class="btn" onclick="showLabels()">🏷️ 显示地标</button>
        </div>
    </div>
    
    <div class="info">
        <p>🖱️ 拖动旋转 | 滚轮缩放 | 右键平移</p>
        <p>当前位置: <span id="position">0°N, 0°E</span></p>
        <p>帧率: <span id="fps">60</span> FPS</p>
    </div>
    
    <div class="axis-indicator">
        <div class="axis-label">N</div>
        <div class="axis-line"></div>
        <div class="axis-label">S</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const container = document.getElementById('container');
        
        let scene, camera, renderer;
        let earth, atmosphere;
        let isDragging = false;
        let previousMousePosition = { x:0, y:0 };
        let targetRotationX = 0;
        let targetRotationY = 0;
        let currentRotationX = 0;
        let currentRotationY = 0;
        let autoRotation = true;
        let rotationSpeed = 1;
        let zoom = 4;
        let labelSprite;
        
        const landmarkData = [
            { name:'北京', lat:39.9042, lng:116.4074 },
            { name:'纽约', lat:40.7128, lng:-74.006 },
            { name:'伦敦', lat:51.5074, lng:-0.1278 },
            { name:'东京', lat:35.6762, lng:139.6503 },
            { name:'悉尼', lat:-33.8688, lng:151.2093 },
            { name:'巴黎', lat:48.8566, lng:2.3522 },
            { name:'开罗', lat:30.0444, lng:31.2357 },
            { name:'里约', lat:-22.9068, lng:-43.1729 },
            { name:'莫斯科', lat:55.7558, lng:37.6173 },
            { name:'新加坡', lat:1.3521, lng:103.8198 }
        ];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = zoom;
            
            renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x4fc3f7, 0.5, 100);
            pointLight.position.set(-5, -3, -5);
            scene.add(pointLight);
            
            createEarth();
            createStars();
            
            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel);
            
            document.getElementById('rotationSpeed').addEventListener('input', (e) => {
                rotationSpeed = parseFloat(e.target.value);
                document.getElementById('speedValue').textContent = rotationSpeed.toFixed(1);
            });
            
            document.getElementById('zoom').addEventListener('input', (e) => {
                zoom = parseFloat(e.target.value);
                document.getElementById('zoomValue').textContent = zoom.toFixed(1);
            });
            
            document.getElementById('lightIntensity').addEventListener('input', (e) => {
                const intensity = parseFloat(e.target.value);
                directionalLight.intensity = intensity;
                document.getElementById('lightValue').textContent = intensity.toFixed(1);
            });
            
            animate();
        }
        
        function createEarth() {
            const geometry = new THREE.SphereGeometry(1, 64, 64);
            
            const canvasTexture = document.createElement('canvas');
            canvasTexture.width = 2048;
            canvasTexture.height = 1024;
            const ctx = canvasTexture.getContext('2d');
            
            ctx.fillStyle = '#1e5f8a';
            ctx.fillRect(0, 0, canvasTexture.width, canvasTexture.height);
            
            drawContinents(ctx, canvasTexture.width, canvasTexture.height);
            
            const texture = new THREE.CanvasTexture(canvasTexture);
            
            const material = new THREE.MeshPhongMaterial({
                map:texture,
                shininess:15,
                specular:new THREE.Color(0x333333)
            });
            
            earth = new THREE.Mesh(geometry, material);
            scene.add(earth);
            
            const atmosphereGeometry = new THREE.SphereGeometry(1.02, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader:`
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader:`
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                    }
                `,
                blending:THREE.AdditiveBlending,
                side:THREE.BackSide,
                transparent:true
            });
            
            atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphere);
            
            addGridLines();
        }
        
        function latLngToXY(lat, lng, width, height) {
            return {
                x: (lng + 180) / 360 * width,
                y: (90 - lat) / 180 * height
            };
        }
        
        function drawContinents(ctx, width, height) {
            ctx.fillStyle = '#2d7d46';
            
            function drawContinent(points) {
                ctx.beginPath();
                ctx.moveTo(points[0].x * width, points[0].y * height);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x * width, points[i].y * height);
                }
                ctx.closePath();
                ctx.fill();
            }
            
            const northAmerica = [
                {x:0.10,y:0.12},{x:0.15,y:0.10},{x:0.20,y:0.12},{x:0.25,y:0.15},{x:0.28,y:0.20},
                {x:0.30,y:0.28},{x:0.28,y:0.38},{x:0.24,y:0.45},{x:0.18,y:0.48},{x:0.14,y:0.45},
                {x:0.12,y:0.38},{x:0.10,y:0.30},{x:0.12,y:0.22},{x:0.18,y:0.18},{x:0.25,y:0.15}
            ];
            drawContinent(northAmerica);
            
            const southAmerica = [
                {x:0.22,y:0.52},{x:0.26,y:0.55},{x:0.29,y:0.62},{x:0.30,y:0.72},{x:0.28,y:0.82},
                {x:0.24,y:0.90},{x:0.20,y:0.92},{x:0.18,y:0.88},{x:0.17,y:0.80},{x:0.18,y:0.70},
                {x:0.20,y:0.60},{x:0.22,y:0.52}
            ];
            drawContinent(southAmerica);
            
            const europe = [
                {x:0.45,y:0.15},{x:0.48,y:0.12},{x:0.52,y:0.14},{x:0.55,y:0.18},{x:0.57,y:0.22},
                {x:0.55,y:0.28},{x:0.52,y:0.30},{x:0.48,y:0.28},{x:0.45,y:0.25},{x:0.44,y:0.20}
            ];
            drawContinent(europe);
            
            const africa = [
                {x:0.46,y:0.35},{x:0.50,y:0.32},{x:0.55,y:0.35},{x:0.58,y:0.42},{x:0.57,y:0.55},
                {x:0.55,y:0.68},{x:0.52,y:0.75},{x:0.48,y:0.72},{x:0.44,y:0.65},{x:0.43,y:0.55},
                {x:0.44,y:0.45},{x:0.46,y:0.38}
            ];
            drawContinent(africa);
            
            const asia = [
                {x:0.55,y:0.10},{x:0.62,y:0.08},{x:0.72,y:0.10},{x:0.82,y:0.15},{x:0.87,y:0.22},
                {x:0.85,y:0.35},{x:0.80,y:0.45},{x:0.72,y:0.48},{x:0.65,y:0.45},{x:0.58,y:0.40},
                {x:0.55,y:0.32},{x:0.54,y:0.20},{x:0.55,y:0.10}
            ];
            drawContinent(asia);
            
            const australia = [
                {x:0.75,y:0.68},{x:0.80,y:0.65},{x:0.85,y:0.68},{x:0.87,y:0.75},{x:0.84,y:0.80},
                {x:0.80,y:0.82},{x:0.76,y:0.80},{x:0.74,y:0.75},{x:0.73,y:0.70}
            ];
            drawContinent(australia);
            
            const greenland = [
                {x:0.22,y:0.06},{x:0.28,y:0.04},{x:0.32,y:0.08},{x:0.30,y:0.14},{x:0.26,y:0.16},
                {x:0.23,y:0.12}
            ];
            drawContinent(greenland);
            
            ctx.fillStyle = '#3d8b5f';
            ctx.globalAlpha = 0.5;
            for (let i = 0; i < 300; i++) {
                const x = Math.random();
                const y = Math.random();
                const r = Math.random() * 6 + 1;
                ctx.beginPath();
                ctx.arc(x * width, y * height, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        function addGridLines() {
            const gridHelper = new THREE.Group();
            
            for (let lat = -80; lat <= 80; lat += 20) {
                const points = [];
                for (let lng = 0; lng <= 360; lng += 5) {
                    const phi = (90 - lat) * Math.PI / 180;
                    const theta = lng * Math.PI / 180;
                    points.push(new THREE.Vector3(
                        1.01 * Math.sin(phi) * Math.cos(theta),
                        1.01 * Math.cos(phi),
                        1.01 * Math.sin(phi) * Math.sin(theta)
                    ));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color:0x333355, transparent:true, opacity:0.3 });
                gridHelper.add(new THREE.Line(geometry, material));
            }
            
            for (let lng = 0; lng < 360; lng += 30) {
                const points = [];
                for (let lat = -90; lat <= 90; lat += 5) {
                    const phi = (90 - lat) * Math.PI / 180;
                    const theta = lng * Math.PI / 180;
                    points.push(new THREE.Vector3(
                        1.01 * Math.sin(phi) * Math.cos(theta),
                        1.01 * Math.cos(phi),
                        1.01 * Math.sin(phi) * Math.sin(theta)
                    ));
                }
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                const material = new THREE.LineBasicMaterial({ color:0x333355, transparent:true, opacity:0.3 });
                gridHelper.add(new THREE.Line(geometry, material));
            }
            
            scene.add(gridHelper);
        }
        
        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color:0xffffff,
                size:0.01,
                sizeAttenuation:true
            });
            
            const starsVertices = [];
            for (let i = 0; i < 2000; i++) {
                const x = (Math.random() - 0.5) * 100;
                const y = (Math.random() - 0.5) * 100;
                const z = (Math.random() - 0.5) * 100;
                starsVertices.push(x, y, z);
            }
            
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }
        
        function addLandmarks() {
            if (labelSprite) {
                scene.remove(labelSprite);
                labelSprite = null;
            }
            
            labelSprite = new THREE.Group();
            
            landmarkData.forEach(landmark => {
                const phi = (90 - landmark.lat) * Math.PI / 180;
                const theta = landmark.lng * Math.PI / 180;
                
                const x = 1.02 * Math.sin(phi) * Math.cos(theta);
                const y = 1.02 * Math.cos(phi);
                const z = 1.02 * Math.sin(phi) * Math.sin(theta);
                
                const markerGeometry = new THREE.SphereGeometry(0.015, 16, 16);
                const markerMaterial = new THREE.MeshBasicMaterial({ color:0xff6b6b });
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                marker.position.set(x, y, z);
                labelSprite.add(marker);
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 128;
                canvas.height = 32;
                
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(120, 0);
                ctx.quadraticCurveTo(128, 0, 128, 8);
                ctx.lineTo(128, 24);
                ctx.quadraticCurveTo(128, 32, 120, 32);
                ctx.lineTo(8, 32);
                ctx.quadraticCurveTo(0, 32, 0, 24);
                ctx.lineTo(0, 8);
                ctx.quadraticCurveTo(0, 0, 8, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(landmark.name, 64, 22);
                
                const texture = new THREE.CanvasTexture(canvas);
                const spriteMaterial = new THREE.SpriteMaterial({ map:texture });
                const sprite = new THREE.Sprite(spriteMaterial);
                sprite.position.set(x * 1.05, y * 1.05, z * 1.05);
                sprite.scale.set(0.5, 0.125, 1);
                labelSprite.add(sprite);
            });
            
            scene.add(labelSprite);
        }
        
        function onMouseDown(e) {
            isDragging = true;
            previousMousePosition = { x:e.clientX, y:e.clientY };
        }
        
        function onMouseMove(e) {
            if (!isDragging) return;
            
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            
            targetRotationY += deltaX * 0.005;
            targetRotationX += deltaY * 0.005;
            
            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
            
            previousMousePosition = { x:e.clientX, y:e.clientY };
            
            updatePositionInfo();
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onWheel(e) {
            e.preventDefault();
            zoom += e.deltaY * 0.002;
            zoom = Math.max(2, Math.min(10, zoom));
            document.getElementById('zoom').value = zoom;
            document.getElementById('zoomValue').textContent = zoom.toFixed(1);
        }
        
        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        function updatePositionInfo() {
            const lng = (targetRotationY % (Math.PI * 2)) * 180 / Math.PI;
            const lat = (Math.PI / 2 - targetRotationX) * 180 / Math.PI - 90;
            
            const latStr = Math.abs(lat).toFixed(1) + (lat >= 0 ? '°N' : '°S');
            const lngStr = Math.abs(lng).toFixed(1) + (lng >= 0 ? '°E' : '°W');
            
            document.getElementById('position').textContent = `${latStr}, ${lngStr}`;
        }
        
        function resetView() {
            targetRotationX = 0;
            targetRotationY = 0;
            zoom = 4;
            document.getElementById('zoom').value = zoom;
            document.getElementById('zoomValue').textContent = zoom.toFixed(1);
        }
        
        function toggleRotation() {
            autoRotation = !autoRotation;
            const btn = document.querySelector('.btn:nth-child(2)');
            btn.textContent = autoRotation ? '⏸️ 暂停/播放' : '▶️ 暂停/播放';
        }
        
        function showLabels() {
            if (labelSprite) {
                scene.remove(labelSprite);
                labelSprite = null;
            } else {
                addLandmarks();
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (autoRotation && !isDragging) {
                targetRotationY += 0.005 * rotationSpeed;
            }
            
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;
            
            earth.rotation.x = currentRotationX;
            earth.rotation.y = currentRotationY;
            
            if (atmosphere) {
                atmosphere.rotation.x = currentRotationX;
                atmosphere.rotation.y = currentRotationY;
            }
            
            if (labelSprite) {
                labelSprite.rotation.x = currentRotationX;
                labelSprite.rotation.y = currentRotationY;
            }
            
            camera.position.z += (zoom - camera.position.z) * 0.1;
            
            renderer.render(scene, camera);
            
            document.getElementById('fps').textContent = Math.round(1000 / (performance.now() - lastTime));
            lastTime = performance.now();
        }
        
        let lastTime = performance.now();
        
        init();
    </script>
</body>
</html>
